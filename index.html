    const $ = id => d.getElementById(id);

    const assignedInput = $("assignedTo");
    const visitInput = $("date");
    let assignmentInput = $("assignmentDate");
    if (assignedInput && visitInput && !assignmentInput) {
      const assignedLabel = assignedInput.previousElementSibling;
      const visitLabel = visitInput.previousElementSibling;
      if (assignedLabel && visitLabel) {
        visitLabel.before(assignedLabel, assignedInput);
        const assignmentLabel = d.createElement("label");
        assignmentLabel.textContent = "Fecha de asignación";

        assignmentInput.type = "date";
        assignedInput.after(assignmentLabel, assignmentInput);

    // Lógica de Fecha de asignación, ejecutada dentro de la aplicación original.
    if (assignmentInput) {

      assignmentLogic.textContent = `
(function(){
  if (window.__assignmentDateDefinitivePatch) return;
  window.__assignmentDateDefinitivePatch = true;

  const assignment = document.getElementById("assignmentDate");
  const visit = document.getElementById("date");
  const status = document.getElementById("status");
  if (!assignment || !visit) return;

  if (typeof MAP_SOURCES !== "undefined" && MAP_SOURCES.hd) {
    MAP_SOURCES.hd.label = "Blanco y negro";
  }
  const hd = document.getElementById("mapHdBtn");
  if (hd) hd.textContent = "Blanco y negro";

  const originalOpenPanel = openPanel;
  openPanel = function(t){
    originalOpenPanel(t);
    assignment.value = (t && t.fecha_asignacion) || "";
    assignment.disabled = !!visit.disabled;
  };

  new MutationObserver(function(){
    assignment.disabled = !!visit.disabled;
  }).observe(visit,{attributes:true,attributeFilter:["disabled"]});

  if (status) {
    status.addEventListener("change", function(){
      if (status.value === "assigned") visit.value = "";
    });
  }

  loadHistory = async function(id){
    const result = await db.from("historial_territorios")
      .select("*").eq("territorio_id",id)
      .order("created_at",{ascending:false}).limit(4);
    const history = document.getElementById("history");
    if (result.error) {
      history.innerHTML = "<hr><b>Últimos 4 cambios</b><div class='small'>No se pudo cargar el historial.</div>";
      return;
    }
    const data = result.data;
    history.innerHTML = data && data.length
      ? "<hr><b>Últimos 4 cambios</b><br>" +
        data.map(function(h){
          return "Asignación: " + esc(h.fecha_asignacion || "-") +
            " — Visita: " + esc(h.estado === "done" ? (h.fecha || "-") : "-") +
            " — Asignado a: " + esc(h.asignado_a || "") +
            " — Realizado por: " + esc(h.persona || "") +
            " — " + statusName(h.estado || "") +
            (h.observaciones ? " — " + esc(h.observaciones) : "");
        }).join("<br>")
      : "<hr><b>Últimos 4 cambios</b><br><span class='small'>Todavía no hay cambios registrados.</span>";
  };

  document.getElementById("save").onclick = async function(){
    if(!currentUser){ alert("Necesitás iniciar sesión."); return; }
    if(currentRole==="lector"){ alert("Este usuario es de solo lectura."); return; }
    if(!sel) return;

    const editor=otherEditorFor(sel.id);
    if(editor){
      alert((editor.nombre||"Otro usuario")+" está editando este territorio. Esperá a que termine.");
      return;
    }

    const freshResult=await db.from("territorios").select("*").eq("id",sel.id).single();
    if(freshResult.error){
      alert("No se pudo verificar si el territorio cambió. Probá nuevamente.");
      return;
    }
    const fresh=freshResult.data;

    if(String(fresh.updated_at||"")!==String(sel.updated_at||"")){
      alert("Este territorio cambió mientras lo tenías abierto. Se cargará la versión más reciente para evitar pisar el cambio de otro usuario.");
      await loadTerritories();
      const latest=ts.find(function(t){ return String(t.id)===String(sel.id); })||fresh;
      openPanel(latest);
      return;
    }

    const numero=currentRole==="admin"
      ? (document.getElementById("num").value.trim()||String(sel.numero))
      : String(sel.numero);

    const requestedStatus=document.getElementById("status").value;
    const assignmentDate=assignment.value||null;
    const enteredVisit=visit.value||null;

    if((requestedStatus==="assigned" || requestedStatus==="done") && !assignmentDate){
      alert("Primero cargá la fecha de asignación.");
      assignment.focus();
      return;
    }

    const finalDate=requestedStatus==="assigned"
      ? null
      : ((requestedStatus==="done" && !enteredVisit)
        ? new Date().toISOString().slice(0,10)
        : enteredVisit);

    if(assignmentDate && finalDate && finalDate < assignmentDate){
      alert("La fecha de visita no puede ser anterior a la fecha de asignación.");
      visit.focus();
      return;
    }

    const payload={
      numero:numero,
      manzanas:currentRole==="admin"
        ? Math.max(1,Number(document.getElementById("blocks").value)||1)
        : Math.max(1,Number(sel.manzanas)||1),
      estado:requestedStatus,
      fecha_asignacion:assignmentDate,
      fecha_ultima_visita:finalDate,
      asignado_a:document.getElementById("assignedTo").value.trim(),
      persona:document.getElementById("person").value.trim(),
      observaciones:document.getElementById("notes").value.trim(),
      updated_at:new Date().toISOString(),
      updated_by:currentUser && currentUser.id ? currentUser.id : null,
      updated_by_email:currentUser && currentUser.email ? currentUser.email : ""
    };

    if(payload.estado==="done" && daysSince(payload.fecha_ultima_visita)>=28){
      payload.estado="available";
    }

    const sessionResult=await db.auth.getSession();
    const session=sessionResult.data && sessionResult.data.session;
    if(!session){
      alert("Sesión no válida.");
      return;
    }

    const respuesta=await fetch(
      "https://pmogqedfxspyudezyvwd.supabase.co/functions/v1/smooth-endpoint",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+session.access_token
        },
        body:JSON.stringify({
          accion:"actualizar_territorio",
          id:sel.id,
          ...payload
        })
      }
    );

    const resultado=await respuesta.json();
    if(!respuesta.ok || !resultado.ok){
      alert("No se pudo guardar: "+(resultado.mensaje||"Error desconocido"));
      return;
    }

    sel=resultado.territorio;
    await loadTerritories();
    openPanel(sel);
  };
})();

    let zoom = 1;
    let baseWidth = 0;

    function center(){
      return {
        x:(area.scrollLeft + area.clientWidth/2) / Math.max(1, area.scrollWidth),
        y:(area.scrollTop + area.clientHeight/2) / Math.max(1, area.scrollHeight)
      };
    }

    function geometry(){
      if(!img.naturalWidth || !img.naturalHeight) return;
      const aw = Math.max(280, area.clientWidth - 36);
      const ah = Math.max(260, (area.clientHeight || Math.round(w.innerHeight*.78)) - 36);
      const aspect = img.naturalHeight / img.naturalWidth;
      baseWidth = Math.min(aw, ah/aspect, img.naturalWidth);
      const width = Math.round(baseWidth * zoom);
      const height = Math.round(width * aspect);
      box.style.width = width + "px";
      box.style.height = height + "px";
      img.style.width = width + "px";
      img.style.height = height + "px";
      const areas = $("areas"), points = $("points");
      if(areas){ areas.style.width = width + "px"; areas.style.height = height + "px"; }
      if(points){ points.style.width = width + "px"; points.style.height = height + "px"; }
      area.classList.toggle("pan-ready", zoom > 1);
    }

    function apply(next, c){
      zoom = Math.max(1, Math.min(4, next));
      geometry();
      zoomLabel.textContent = Math.round(zoom*100) + "%";
      w.requestAnimationFrame(() => {
        if(c){
          area.scrollLeft = c.x * area.scrollWidth - area.clientWidth/2;
          area.scrollTop = c.y * area.scrollHeight - area.clientHeight/2;
        }
      });
    }

    function fit(){
      zoom = 1;
      geometry();
      zoomLabel.textContent = "100%";
      area.scrollTo({left:0,top:0});
    }


    if (colorBtn) colorBtn.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const c = center();
      await w.switchMap("color");
      if (hdBtn) hdBtn.textContent = "Blanco y negro";
      apply(zoom,c);
    };
    if (hdBtn) hdBtn.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const c = center();
      await w.switchMap("hd");
      hdBtn.textContent = "Blanco y negro";
      apply(zoom,c);
    };

    zoomIn.onclick = e => { e.preventDefault(); e.stopPropagation(); apply(zoom + .5, center()); };
    zoomOut.onclick = e => { e.preventDefault(); e.stopPropagation(); apply(zoom - .5, center()); };
    zoomReset.onclick = e => { e.preventDefault(); e.stopPropagation(); fit(); };

    area.addEventListener("wheel", e => {
      if(!e.ctrlKey) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      apply(zoom + (e.deltaY < 0 ? .25 : -.25), center());
    }, {passive:false, capture:true});

    const refit = () => setTimeout(fit, 100);
    if(img.complete && img.naturalWidth) refit();
    else img.addEventListener("load", refit);

    const gate = $("authGate");
    if(gate){
      new MutationObserver(() => {
        const hidden = gate.style.display === "none" || getComputedStyle(gate).display === "none";
        if(hidden) setTimeout(fit, 180);
      }).observe(gate,{attributes:true,attributeFilter:["style","class"]});
    }

    w.addEventListener("resize", fit);
    setTimeout(fit, 700);
  }

  frame.addEventListener("load", () => {
    setTimeout(install, 150);
    setTimeout(install, 1000);
  });
})();
