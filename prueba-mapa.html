<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de mapa — Gestor de Territorios</title>
<style>
html,body{margin:0;height:100%;background:#eef2f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#bar{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#172033;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box}
#bar span{opacity:.85;font-weight:500}
iframe{display:block;width:100%;height:calc(100% - 42px);border:0;background:#fff}
</style>
</head>
<body>
<div id="bar">🧪 Prueba de mapa <span>Vista completa al entrar · zoom hasta 400% · no modifica la página definitiva</span></div>
<iframe id="app" src="./index.html?prueba-mapa=1"></iframe>
<script>
(() => {
  const frame = document.getElementById("app");

  function install(){
    let w, d;
    try { w = frame.contentWindow; d = frame.contentDocument; } catch(e){ return; }
    if(!d || d.__zoomTestInstalled) return;
    d.__zoomTestInstalled = true;

    const $ = id => d.getElementById(id);
    const area = $("area"), box = $("box"), img = $("map");
    const zoomIn = $("zoomIn"), zoomOut = $("zoomOut"), zoomReset = $("zoomReset"), zoomLabel = $("zoomLabel");
    const colorBtn = $("mapColorBtn"), hdBtn = $("mapHdBtn");
    if(!area || !box || !img || !zoomIn || !zoomOut || !zoomReset || !zoomLabel) return;

    if(hdBtn) hdBtn.textContent = "Blanco y negro";

    // Colocar los controles del mapa junto a la leyenda de estados.
    const legend = d.querySelector(".legend");
    const mapControls = d.querySelector(".map-controls");
    if(legend && mapControls){
      legend.appendChild(mapControls);
      legend.style.display = "flex";
      legend.style.alignItems = "center";
      legend.style.gap = "8px";
      legend.style.flexWrap = "wrap";

      mapControls.style.margin = "0 0 0 auto";
      mapControls.style.padding = "0";
      mapControls.style.maxWidth = "none";
      mapControls.style.display = "flex";
      mapControls.style.alignItems = "center";
      mapControls.style.gap = "6px";
      mapControls.style.flexWrap = "wrap";

      legend.style.position = "relative";
      legend.style.minHeight = "44px";
      legend.style.paddingRight = "560px";

      const compactStyle = d.createElement("style");
      compactStyle.textContent = `
        .legend > .map-controls{
          position:absolute!important;
          right:0!important;
          top:50%!important;
          transform:translateY(-50%)!important;
          margin:0!important;
          padding:0!important;
          width:auto!important;
          max-width:none!important;
          flex-wrap:nowrap!important;
          justify-content:flex-end!important;
          background:transparent!important;
        }
        .legend .map-controls .legend-title{margin-left:0}
        .legend .map-controls .map-switch{flex-shrink:0}
        .legend .map-controls .zoom-btn{min-width:34px}
        @media(max-width:1100px){
          .legend{padding-right:0!important}
          .legend > .map-controls{
            position:relative!important;
            right:auto!important;
            top:auto!important;
            transform:none!important;
            width:100%!important;
            margin-top:8px!important;
            justify-content:flex-start!important;
            flex-wrap:wrap!important;
          }
        }
      `;
      d.head.appendChild(compactStyle);
    }

    // Tema visual profesional: superficies con capas suaves y color de marca moderado.
    const premiumStyle = d.createElement("style");
    premiumStyle.textContent = `
      :root{
        --app-bg:#eaf1f7;
        --app-bg-2:#f4f8fc;
        --brand-deep:#183153;
        --brand:#2563eb;
        --brand-soft:#eaf2ff;
        --teal:#0f766e;
        --line-soft:#d7e2ee;
        --shadow-soft:0 8px 24px rgba(24,49,83,.08);
      }

      body{
        background:
          radial-gradient(circle at 12% 0%, rgba(37,99,235,.07), transparent 26%),
          linear-gradient(180deg,var(--app-bg-2) 0%,var(--app-bg) 100%)!important;
      }

      header{
        background:linear-gradient(135deg,#fbfdff 0%,#eef5fc 58%,#e7f0fa 100%)!important;
        border-bottom:1px solid #cddbea!important;
        box-shadow:0 8px 24px rgba(24,49,83,.07)!important;
      }

      .brand-mark{
        background:linear-gradient(135deg,#183153 0%,#2563eb 100%)!important;
        box-shadow:0 6px 16px rgba(37,99,235,.22)!important;
      }

      .brand h1{color:#183153!important}
      .brand p{color:#5b6f88!important}

      #connection,.user-chip{
        border:1px solid #d8e3ef!important;
        background:rgba(255,255,255,.78)!important;
        box-shadow:0 2px 8px rgba(24,49,83,.04)!important;
      }

      .date-chip{
        background:#eaf2ff!important;
        color:#1e4f9f!important;
        border-color:#c9dcff!important;
      }

      .toolbar button#edit{
        background:linear-gradient(135deg,#183153,#294e79)!important;
        box-shadow:0 5px 14px rgba(24,49,83,.18)!important;
      }

      .tools-menu summary{
        background:#f8fbff!important;
        border-color:#cfdceb!important;
        color:#314b68!important;
      }

      .tools-pop{
        border-color:#d4e0ed!important;
        box-shadow:0 16px 34px rgba(24,49,83,.14)!important;
      }

      .dashboard .card{
        border-color:#d7e3ef!important;
        box-shadow:0 8px 22px rgba(24,49,83,.07)!important;
      }
      .dashboard .card:nth-child(1){
        background:linear-gradient(135deg,#ffffff 0%,#edf4ff 100%)!important;
      }
      .dashboard .card:nth-child(2){
        background:linear-gradient(135deg,#ffffff 0%,#ecfdf5 100%)!important;
      }
      .dashboard .card:nth-child(3){
        background:linear-gradient(135deg,#ffffff 0%,#eef8ff 100%)!important;
      }
      .dashboard .card:nth-child(4){
        background:linear-gradient(135deg,#ffffff 0%,#fff1f2 100%)!important;
      }
      .card .kicker{color:#5f738c!important}
      .card .value{color:#183153!important}

      .legend{
        background:linear-gradient(90deg,#f8fbff 0%,#eef5fb 100%)!important;
        border:1px solid #d4e1ed!important;
        border-radius:12px!important;
        padding-top:10px!important;
        padding-bottom:10px!important;
        padding-left:12px!important;
        box-shadow:0 6px 18px rgba(24,49,83,.06)!important;
      }

      .legend .lav{
        background:#eafaf0!important;
        border-color:#bfe8cc!important;
        color:#166534!important;
      }
      .legend .lb{
        background:#eaf4ff!important;
        border-color:#bfd8f5!important;
        color:#075985!important;
      }
      .legend .lg{
        background:#fff0f1!important;
        border-color:#f3c7cb!important;
        color:#991b1b!important;
      }

      .legend .map-switch{
        background:#dce8f4!important;
        border:1px solid #c9d8e7!important;
      }
      .legend .map-switch button{
        color:#3e5873!important;
      }
      .legend .map-switch button.active{
        background:#ffffff!important;
        color:#1d4ed8!important;
        box-shadow:0 2px 7px rgba(24,49,83,.12)!important;
      }
      .legend .zoom-btn{
        background:#ffffff!important;
        border:1px solid #c8d7e6!important;
        color:#27435f!important;
        box-shadow:0 2px 7px rgba(24,49,83,.07)!important;
      }
      .legend .zoom-btn:hover{
        background:#edf5ff!important;
        border-color:#9ebfe3!important;
      }
      .legend .zoom-label{
        color:#36516e!important;
      }

      #area{
        background:
          linear-gradient(180deg,rgba(214,228,241,.96) 0%,rgba(234,241,247,.98) 100%)!important;
        border-top:1px solid #c9d8e5!important;
        border-bottom:1px solid #c9d8e5!important;
      }

      #box{
        border-color:#c5d4e2!important;
        box-shadow:0 12px 34px rgba(24,49,83,.13)!important;
      }

      #list{
        background:linear-gradient(180deg,#ffffff 0%,#f7faff 100%)!important;
        border-color:#d5e1ec!important;
        box-shadow:0 8px 22px rgba(24,49,83,.07)!important;
      }
      #listToggle{
        background:#f3f8fd!important;
        border-color:#cddbe8!important;
        color:#314d69!important;
      }
      .item:hover{background:#edf5fc!important}

      #panel{
        background:linear-gradient(180deg,#ffffff 0%,#f7fbff 100%)!important;
        border-color:#cddbea!important;
        box-shadow:0 20px 54px rgba(24,49,83,.22)!important;
      }

      input,select,textarea{
        background:#fbfdff!important;
        border-color:#cbd9e7!important;
      }
      input:focus,select:focus,textarea:focus{
        border-color:#6ea0dc!important;
        box-shadow:0 0 0 3px rgba(37,99,235,.12)!important;
      }

      @media(max-width:800px){
        .dashboard .card{box-shadow:0 5px 14px rgba(24,49,83,.06)!important}
        .legend{border-radius:10px!important}
      }
    `;
    d.head.appendChild(premiumStyle);

    let zoom = 1;
    let baseWidth = 0;

    function center(){
      return {
        x:(area.scrollLeft + area.clientWidth/2) / Math.max(1, area.scrollWidth),
        y:(area.scrollTop + area.clientHeight/2) / Math.max(1, area.scrollHeight)
      };
    }

    function geometry(){
      if(!img.naturalWidth || !img.naturalHeight) return;
      const aw = Math.max(280, area.clientWidth - 36);
      const ah = Math.max(260, (area.clientHeight || Math.round(w.innerHeight*.78)) - 36);
      const aspect = img.naturalHeight / img.naturalWidth;
      baseWidth = Math.min(aw, ah/aspect, img.naturalWidth);
      const width = Math.round(baseWidth * zoom);
      const height = Math.round(width * aspect);
      box.style.width = width + "px";
      box.style.height = height + "px";
      img.style.width = width + "px";
      img.style.height = height + "px";
      const areas = $("areas"), points = $("points");
      if(areas){ areas.style.width = width + "px"; areas.style.height = height + "px"; }
      if(points){ points.style.width = width + "px"; points.style.height = height + "px"; }
      area.classList.toggle("pan-ready", zoom > 1);
    }

    function apply(next, c){
      zoom = Math.max(1, Math.min(4, next));
      geometry();
      zoomLabel.textContent = Math.round(zoom*100) + "%";
      w.requestAnimationFrame(() => {
        if(c){
          area.scrollLeft = c.x * area.scrollWidth - area.clientWidth/2;
          area.scrollTop = c.y * area.scrollHeight - area.clientHeight/2;
        }
      });
    }

    function fit(){
      zoom = 1;
      geometry();
      zoomLabel.textContent = "100%";
      area.scrollTo({left:0,top:0});
    }

    zoomIn.onclick = e => { e.preventDefault(); e.stopPropagation(); apply(zoom + .5, center()); };
    zoomOut.onclick = e => { e.preventDefault(); e.stopPropagation(); apply(zoom - .5, center()); };
    zoomReset.onclick = e => { e.preventDefault(); e.stopPropagation(); fit(); };

    area.addEventListener("wheel", e => {
      if(!e.ctrlKey) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      apply(zoom + (e.deltaY < 0 ? .25 : -.25), center());
    }, {passive:false, capture:true});

    const refit = () => setTimeout(fit, 100);
    if(img.complete && img.naturalWidth) refit();
    else img.addEventListener("load", refit);

    const gate = $("authGate");
    if(gate){
      new MutationObserver(() => {
        const hidden = gate.style.display === "none" || getComputedStyle(gate).display === "none";
        if(hidden) setTimeout(fit, 180);
      }).observe(gate,{attributes:true,attributeFilter:["style","class"]});
    }

    w.addEventListener("resize", fit);
    setTimeout(fit, 700);
  }

  frame.addEventListener("load", () => {
    setTimeout(install, 150);
    setTimeout(install, 1000);
  });
})();
</script>
</body>
</html>
